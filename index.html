<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figurinhas Pimpões</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#13325B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pimpões" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f0e8;
      color: #1e293b;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }

    /* ---- HEADER ---- */
    header {
      background: linear-gradient(135deg, #13325B 0%, #1a4a8a 100%);
      padding: 0.8rem 0.9rem 0.7rem;
      color: white;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.45rem;
    }
    .header-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      flex-shrink: 0;
    }
    .header-title-block { flex: 1; min-width: 0; }
    h1 {
      font-size: 0.95rem;
      font-weight: 900;
      color: white;
      line-height: 1.1;
    }
    .header-subtitle {
      font-size: 0.58rem;
      color: rgba(255,255,255,0.65);
      margin-top: 0.1rem;
    }
    .header-pct {
      font-size: 2rem;
      font-weight: 900;
      color: white;
      line-height: 1;
      flex-shrink: 0;
    }
    .progress-track {
      background: rgba(255,255,255,0.2);
      border-radius: 9999px;
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: #22c55e;
      transition: width 0.4s ease;
    }

    /* ---- CONTROLS ---- */
    .controls {
      display: flex;
      gap: 0.4rem;
      padding: 0.5rem 0.75rem;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }
    .btn {
      flex: 1;
      padding: 0.45rem 0.3rem;
      border-radius: 0.5rem;
      font-size: 0.62rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid #d1d5db;
      background: white;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background: #f3f4f6; }
    .btn-danger { color: #dc2626; border-color: #fca5a5; }
    .btn-export { color: #7c3aed; border-color: #c4b5fd; }

    /* ---- MAIN ---- */
    main {
      padding: 0.6rem 0.65rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      max-width: 700px;
      margin: 0 auto;
    }

    /* ---- CONFEDERATION CARD ---- */
    .conf-section {
      background: white;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .conf-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      background: #f8fafc;
      border-bottom: 1px solid #f1f5f9;
    }
    .conf-name {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      color: #2563eb;
      border-left: 2px solid #2563eb;
      padding-left: 0.4rem;
      text-transform: uppercase;
    }
    .conf-count {
      font-size: 0.57rem;
      color: #94a3b8;
    }

    /* ---- COUNTRY ROW ---- */
    .country-row {
      display: flex;
      align-items: flex-start;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      border-bottom: 1px solid #f8fafc;
      min-height: 2rem;
    }
    .country-row:last-child { border-bottom: none; }
    .country-row.complete { opacity: 0.48; background: #f0fdf4; }
    .country-row.empty-row { opacity: 0.3; }
    .row-code {
      font-weight: 800;
      font-size: 0.67rem;
      color: #1e293b;
      width: 2.4rem;
      flex-shrink: 0;
      padding-top: 0.22rem;
    }
    .row-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.18rem;
      flex: 1;
      align-items: center;
    }
    .row-badge { font-size: 0.58rem; color: #16a34a; font-weight: 700; }
    .row-empty { font-size: 0.58rem; color: #94a3b8; }

    /* ---- CHIPS ---- */
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.12rem;
      min-width: 1.55rem;
      height: 1.55rem;
      padding: 0 0.32rem;
      border-radius: 9999px;
      font-size: 0.6rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      user-select: none;
      transition: transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:active { transform: scale(0.86); }
    .chip.missing { background: #bfdbfe; color: #1d4ed8; }
    .chip.pending { background: #fde68a; color: #92400e; box-shadow: 0 0 0 2px #fbbf24; }
    .chip.found   { background: #16a34a; color: #fff; }
    .chip.found.hide-found { display: none; }

    /* ---- CONFIRM BAR ---- */
    .confirm-bar {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding-top: 0.18rem;
      flex-basis: 100%;
    }
    .confirm-bar span { font-size: 0.57rem; color: #64748b; }
    .cbtn {
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.58rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    .cbtn.save   { background: #16a34a; color: #fff; }
    .cbtn.cancel { background: #e2e8f0; color: #475569; }

    /* ---- TOAST ---- */
    #toast {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%) translateY(3rem);
      background: #16a34a;
      color: #fff;
      font-weight: 700;
      font-size: 0.7rem;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.22s ease, opacity 0.22s ease;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- PRINT / PDF ---- */
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      body { background: white !important; font-size: 10px; }
      header { position: static !important; background: #13325B !important; padding: 0.5rem 0.7rem !important; }
      .header-pct { font-size: 1.3rem !important; }
      h1 { font-size: 0.8rem !important; }
      .header-subtitle { font-size: 0.5rem !important; }
      .progress-track { height: 4px !important; }

      .controls { display: none !important; }
      #toast, #export-overlay { display: none !important; }
      .confirm-bar { display: none !important; }

      main { padding: 0.3rem 0.5rem 0.5rem !important; gap: 0.4rem !important; }

      .conf-section { box-shadow: none !important; border: 1px solid #cbd5e1 !important; break-inside: avoid; }
      .conf-label { padding: 0.25rem 0.5rem !important; }
      .conf-name { font-size: 0.52rem !important; }
      .conf-count { font-size: 0.5rem !important; }

      .country-row { padding: 0.18rem 0.5rem !important; min-height: 1.3rem !important; border-bottom-color: #f1f5f9 !important; }
      .row-code { font-size: 0.58rem !important; width: 2rem !important; }

      /* Mostra só as faltando */
      .chip.found { display: none !important; }
      .chip.pending { background: #bfdbfe !important; color: #1d4ed8 !important; box-shadow: none !important; }
      .chip { min-width: 1.25rem !important; height: 1.25rem !important; font-size: 0.52rem !important; }

      /* Se todas encontradas, mostra linha apagada */
      .country-row.complete .row-chips::after { content: "coladas ✓"; font-size: 0.52rem; color: #16a34a; font-weight: 700; }
      .row-badge { font-size: 0.52rem !important; }
      .row-empty { font-size: 0.52rem !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <img class="header-icon" src="Icone.svg" alt="ícone" />
      <div class="header-title-block">
        <h1>Figurinhas Pimpões</h1>
        <div class="header-subtitle" id="progress-text">0 de 0 figurinhas coladas</div>
      </div>
      <div class="header-pct" id="progress-pct">0%</div>
    </div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill" style="width:0%"></div>
    </div>
  </header>

  <div class="controls">
    <button id="btn-toggle" class="btn" onclick="toggleShowFound()">👁 Mostrar encontradas</button>
    <button class="btn btn-danger" onclick="resetAll()">↺ Resetar tudo</button>
    <button class="btn btn-export" onclick="exportPage()">📄 Exportar PDF</button>
  </div>

  <main id="app"></main>

  <div id="toast"></div>

  <script>
    // ── DATA ─────────────────────────────────────────────────────────────────────
    const STICKER_DATA = {
      ALG:[19], ARG:[1,8,12,17,20], AUS:[2,5,17], AUT:[7,9],
      BEL:[16], BIH:[3], BRA:[10], CAN:[5,18],
      CIV:[3,15,19], COD:[6,7,14,17], COL:[3,4,8,17], KOR:[8,19],
      CRO:[1,4,12], CPV:[1,9], CUW:[5,16], CZE:[17],
      ECU:[6,9,10,19,20], EGY:[7,12,15], ENG:[2,3,11,20], ESP:[2,6,10,14],
      FRA:[11,15,19], GER:[2,4,5,7,8,11,16], GHA:[3,5], HAI:[7,13],
      IRN:[9,11,16,17], IRQ:[2,9,14], JOR:[1,13,17], JPN:[4],
      QAT:[1,2,4,7,15,18,19], MAR:[1,13], MEX:[4,7,11], NED:[7,11,16,18],
      KSA:[4,5,20], NZL:[2,6,19], PAN:[2,4,12], PAR:[11,15],
      POR:[1,16], RSA:[], SCO:[1,9,16], SEM:[1],
      SUI:[18,19], SWE:[10,11,15], TUN:[3,7], TUR:[3,4,9,13],
      URU:[2], USA:[5,7], UZB:[6,7,9,10,11,12,15], FWC:[6],
    };

    const CONFEDERATIONS = [
      { label:"CONMEBOL", codes:["ARG","BRA","COL","ECU","PAR","URU"] },
      { label:"CONCACAF", codes:["CAN","CUW","HAI","MEX","PAN","USA"] },
      { label:"UEFA",     codes:["AUT","BEL","BIH","CRO","CZE","ENG","ESP","FRA","GER","NED","POR","SCO","SUI","SWE","TUR"] },
      { label:"CAF",      codes:["ALG","CIV","COD","CPV","EGY","GHA","MAR","RSA","SEM","TUN"] },
      { label:"AFC",      codes:["IRN","IRQ","JOR","JPN","KOR","KSA","QAT","UZB"] },
      { label:"OFC",      codes:["AUS","NZL"] },
      { label:"ESPECIAL", codes:["FWC"] },
    ];

    // ── STATE ────────────────────────────────────────────────────────────────────
    const KEY = "figurinhas_pimpoes_v1";
    let state = { found:{}, showFound:false };

    function loadState() {
      try { const r = localStorage.getItem(KEY); if (r) state = JSON.parse(r); } catch(_) {}
    }
    function saveState() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function isFound(code, num) { return (state.found[code]||[]).includes(num); }
    function markFound(code, num) {
      if (!state.found[code]) state.found[code] = [];
      if (!state.found[code].includes(num)) state.found[code].push(num);
    }
    function unmarkFound(code, num) {
      if (!state.found[code]) return;
      state.found[code] = state.found[code].filter(n => n !== num);
      if (!state.found[code].length) delete state.found[code];
    }

    // ── PROGRESS ─────────────────────────────────────────────────────────────────
    function updateProgress() {
      const total = Object.values(STICKER_DATA).reduce((s,a) => s+a.length, 0);
      const found = Object.entries(state.found).reduce((s,[code,arr]) =>
        s + arr.filter(n => (STICKER_DATA[code]||[]).includes(n)).length, 0);
      const pct = total > 0 ? Math.round(found/total*100) : 0;
      document.getElementById("progress-text").textContent = `${found} de ${total} figurinhas coladas`;
      document.getElementById("progress-pct").textContent  = pct + "%";
      const fill = document.getElementById("progress-fill");
      fill.style.width = pct + "%";
    }

    function getConfMissing(conf) {
      return conf.codes.reduce((t, code) => {
        const missing = STICKER_DATA[code] || [];
        const found = (state.found[code]||[]).filter(n => missing.includes(n));
        return t + (missing.length - found.length);
      }, 0);
    }

    // ── RENDER ───────────────────────────────────────────────────────────────────
    function renderAll() {
      const app = document.getElementById("app");
      app.innerHTML = "";
      for (const conf of CONFEDERATIONS) {
        const section = document.createElement("div");
        section.className = "conf-section";

        const missing = getConfMissing(conf);
        const labelDiv = document.createElement("div");
        labelDiv.className = "conf-label";
        labelDiv.innerHTML =
          `<span class="conf-name">${conf.label}</span>` +
          `<span class="conf-count">${missing > 0 ? missing + " faltando" : "completa ✓"}</span>`;
        section.appendChild(labelDiv);

        for (const code of conf.codes) section.appendChild(renderRow(code));
        app.appendChild(section);
      }
      updateProgress();
    }

    function renderRow(code) {
      const missing = STICKER_DATA[code] || [];
      const foundNums = (state.found[code]||[]).filter(n => missing.includes(n));
      const allFound = missing.length > 0 && foundNums.length === missing.length;
      const isEmpty  = missing.length === 0;

      const row = document.createElement("div");
      row.className = "country-row" + (allFound?" complete":"") + (isEmpty?" empty-row":"");
      row.dataset.code = code;

      const codeEl = document.createElement("span");
      codeEl.className = "row-code";
      codeEl.textContent = code;
      row.appendChild(codeEl);

      const chips = document.createElement("div");
      chips.className = "row-chips";
      chips.id = `chips-${code}`;

      if (isEmpty) {
        chips.innerHTML = `<span class="row-empty">sem falta</span>`;
      } else if (allFound && !state.showFound) {
        chips.innerHTML = `<span class="row-badge">Completa ✓</span>`;
      } else {
        for (const num of missing) chips.appendChild(makeChip(code, num));
      }

      row.appendChild(chips);
      return row;
    }

    function makeChip(code, num) {
      const found = isFound(code, num);
      const isPend = pending && pending.code===code && pending.num===num;
      const btn = document.createElement("button");
      let cls = "chip ";
      if (isPend) cls += "pending";
      else if (found) cls += "found" + (!state.showFound ? " hide-found" : "");
      else cls += "missing";
      btn.className = cls;
      if (found) btn.innerHTML = `<span style="font-size:0.55rem">✓</span>${num}`;
      else btn.textContent = num;
      btn.dataset.country = code;
      btn.dataset.num = num;
      btn.addEventListener("click", onChipClick);
      return btn;
    }

    // ── PENDING ──────────────────────────────────────────────────────────────────
    let pending = null;

    function clearPending() {
      if (!pending) return;
      pending.chipEl.classList.remove("pending");
      pending.chipEl.classList.add("missing");
      pending.chipEl.innerHTML = pending.num;
      const bar = document.getElementById("confirm-bar");
      if (bar) bar.remove();
      pending = null;
    }

    function confirmPending() {
      if (!pending) return;
      const { code, num, chipEl } = pending;
      clearPending();
      markFound(code, num);
      chipEl.className = "chip found" + (!state.showFound ? " hide-found" : "");
      chipEl.innerHTML = `<span style="font-size:0.55rem">✓</span>${num}`;
      saveState();
      updateRow(code);
      updateProgress();
      showToast(`${code} #${num} ✓`);
    }

    function showConfirmBar(code, num) {
      const bar = document.createElement("div");
      bar.className = "confirm-bar";
      bar.id = "confirm-bar";
      bar.innerHTML = `<span>Marcar #${num}?</span>`;

      const btnS = document.createElement("button");
      btnS.className = "cbtn save";
      btnS.textContent = "✓ Salvar";
      btnS.addEventListener("click", e => { e.stopPropagation(); confirmPending(); });

      const btnC = document.createElement("button");
      btnC.className = "cbtn cancel";
      btnC.textContent = "✗";
      btnC.addEventListener("click", e => { e.stopPropagation(); clearPending(); });

      bar.appendChild(btnS);
      bar.appendChild(btnC);
      document.getElementById(`chips-${code}`)?.appendChild(bar);
    }

    // ── EVENTS ───────────────────────────────────────────────────────────────────
    function onChipClick(e) {
      e.stopPropagation();
      const btn = e.currentTarget;
      const code = btn.dataset.country;
      const num  = parseInt(btn.dataset.num);

      if (isFound(code, num)) {
        clearPending();
        unmarkFound(code, num);
        btn.className = "chip missing";
        btn.textContent = num;
        saveState();
        updateRow(code);
        updateProgress();
        return;
      }

      if (pending && pending.code===code && pending.num===num) {
        confirmPending(); return;
      }

      clearPending();
      pending = { code, num, chipEl: btn };
      btn.classList.replace("missing","pending");
      showConfirmBar(code, num);
    }

    document.addEventListener("click", () => clearPending());

    function updateRow(code) {
      const missing = STICKER_DATA[code] || [];
      const foundNums = (state.found[code]||[]).filter(n => missing.includes(n));
      const allFound = missing.length > 0 && foundNums.length === missing.length;

      const row = document.querySelector(`.country-row[data-code="${code}"]`);
      if (row) row.classList.toggle("complete", allFound);

      const chips = document.getElementById(`chips-${code}`);
      if (!chips) return;

      if (allFound && !state.showFound) {
        chips.innerHTML = `<span class="row-badge">Completa ✓</span>`;
      } else if (!allFound && chips.querySelector(".row-badge")) {
        chips.innerHTML = "";
        for (const num of missing) chips.appendChild(makeChip(code, num));
      }

      // Atualiza contador da confederação
      const confSection = row?.closest(".conf-section");
      if (confSection) {
        const conf = CONFEDERATIONS.find(c => c.codes.includes(code));
        if (conf) {
          const m = getConfMissing(conf);
          const countEl = confSection.querySelector(".conf-count");
          if (countEl) countEl.textContent = m > 0 ? m + " faltando" : "completa ✓";
        }
      }
    }

    function toggleShowFound() {
      state.showFound = !state.showFound;
      saveState();
      document.getElementById("btn-toggle").textContent =
        state.showFound ? "👁 Ocultar encontradas" : "👁 Mostrar encontradas";
      renderAll();
    }

    function resetAll() {
      if (!confirm("Apagar todo o progresso?")) return;
      state = { found:{}, showFound:false };
      saveState();
      document.getElementById("btn-toggle").textContent = "👁 Mostrar encontradas";
      renderAll();
    }

    // ── EXPORT PDF ───────────────────────────────────────────────────────────────
    function exportPage() {
      clearPending();
      window.print();
    }

    // ── TOAST ────────────────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("visible"), 1800);
    }

    // ── INIT ─────────────────────────────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
      loadState();
      document.getElementById("btn-toggle").textContent =
        state.showFound ? "👁 Ocultar encontradas" : "👁 Mostrar encontradas";
      renderAll();
    });
  </script>
</body>
</html>
